<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- App mark: the Agda goal `{!!}` as a happy little face. Redrawn as clean
       geometry so it stays crisp at every size and reads on both light and
       dark backgrounds: thick braces frame the mark, arch brows sit outside
       above them, manga-style oval eyes + red dots are the `!!` (oversized
       so the bangs stay legible at small sizes). translate(0 11) centers
       the face vertically (content spans y 75..437). -->
