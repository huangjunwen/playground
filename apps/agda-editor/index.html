<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e1e1e" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>agda-editor</title>
    <link rel="stylesheet" href="/src/main.css" />
  </head>
  <body>
    <main id="app">
      <div id="toolbar" class="toolbar">
        <button type="button" data-command="load">Load <kbd>C-c C-l</kbd></button>
        <button type="button" data-command="give">Give <kbd>C-c C-␣</kbd></button>
        <button type="button" data-command="next-goal">Next goal <kbd>C-c C-f</kbd></button>
      </div>
      <div id="main-row">
        <div id="editor-col">
          <div id="editor"></div>
          <div id="dock" class="dock">
            <div class="dock-head">
              <span class="dock-title">Events</span>
              <label class="dock-level">level
                <select>
                  <option value="debug">debug</option>
                  <option value="info" selected>info</option>
                  <option value="warn">warn</option>
                  <option value="error">error</option>
                </select>
              </label>
              <div class="dock-resize" title="drag to resize"></div>
            </div>
            <div class="dock-body">
              <div class="dock-events"></div>
            </div>
          </div>
        </div>
        <div id="side-resize" class="resize-handle resize-handle-vertical" title="drag to resize"></div>
        <div id="side" class="side">
          <section class="panel panel-session">
            <header class="panel-head">Session</header>
            <div class="panel-body" id="session-body"></div>
          </section>
          <div id="panel-resize" class="resize-handle resize-handle-horizontal" title="drag to resize"></div>
          <section class="panel panel-goals">
            <header class="panel-head">Goals</header>
            <div class="panel-body" id="goals-body"></div>
          </section>
        </div>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
