<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e1e1e" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>agda-editor</title>
    <link rel="stylesheet" href="/src/main.css" />
    <script>
      // Theme bootstrap: apply the persisted preference before first
      // paint, so a dark-mode user never sees a light flash. Mirrors
      // the resolution logic of src/ui/theme.ts; the app owns the
      // attribute from its boot on.
      try {
        var theme = JSON.parse(localStorage.getItem('agda-editor:prefs') || '{}').theme;
        var dark =
          theme === 'dark' ||
          (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    </script>
  </head>
  <body>
    <main id="app">
      <div id="toolbar" class="toolbar">
        <span class="toolbar-title"
          ><svg class="toolbar-mark" width="26" height="19" viewBox="40 100 432 312" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
              <path d="M128 128 H122 C98 128 82 144 82 168 V226 C82 244 72 253 56 256 C72 259 82 269 82 288 V344 C82 368 98 384 122 384 H128" stroke-width="26" />
              <path d="M384 128 H390 C414 128 430 144 430 168 V226 C430 244 440 253 456 256 C440 259 430 269 430 288 V344 C430 368 414 384 390 384 H384" stroke-width="26" />
              <path d="M148 170 L214 196" stroke-width="26" />
              <path d="M364 170 L298 196" stroke-width="26" />
              <path d="M173 232 V280" stroke-width="30" />
              <path d="M339 232 V280" stroke-width="30" />
            </g>
            <circle class="dot" cx="173" cy="334" r="22" fill="#e5484d" />
            <circle class="dot" cx="339" cy="334" r="22" fill="#e5484d" /></svg
          >agda-editor</span
        >
        <div class="toolbar-actions">
          <button type="button" id="btn-palette" class="toolbar-icon" title="Command palette (Ctrl+Shift+P)"></button>
          <button type="button" id="btn-theme" class="toolbar-icon" title="Color theme"></button>
          <button type="button" id="btn-vim" class="toolbar-icon" title="Vim mode"></button>
          <button type="button" id="btn-toggle-side" class="toolbar-icon" title="Toggle the sidebar"></button>
          <button type="button" id="btn-toggle-dock" class="toolbar-icon" title="Toggle the logs panel"></button>
        </div>
      </div>
      <div id="main-row">
        <div id="editor-col">
          <div id="editor" class="surface"></div>
          <div id="dock-resize" class="gap gap-row" title="Drag to resize"></div>
          <div id="dock" class="surface dock" data-tab="output">
            <div class="dock-head">
              <div class="dock-tabs" role="tablist">
                <button type="button" class="dock-tab active" data-tab="output" role="tab" aria-selected="true">Output</button>
                <button type="button" class="dock-tab" data-tab="logs" role="tab" aria-selected="false">Logs</button>
              </div>
              <label class="dock-level">level
                <select>
                  <option value="debug">debug</option>
                  <option value="info" selected>info</option>
                  <option value="warn">warn</option>
                  <option value="error">error</option>
                </select>
              </label>
            </div>
            <div class="dock-body">
              <div class="dock-output"></div>
              <div class="dock-logs"></div>
            </div>
          </div>
        </div>
        <div id="side-resize" class="gap gap-col" title="Drag to resize"></div>
        <div id="side" class="side">
          <section class="surface panel panel-session">
            <header class="panel-head">Session</header>
            <div class="panel-body" id="session-body"></div>
          </section>
          <div id="panel-resize" class="gap gap-row" title="Drag to resize"></div>
          <section class="surface panel panel-goals">
            <header class="panel-head">Goals</header>
            <div class="panel-body" id="goals-body"></div>
          </section>
        </div>
      </div>
    </main>
    <div id="palette" class="palette" hidden>
      <div class="palette-panel" role="dialog" aria-label="Command palette">
        <input class="palette-input" placeholder="Type a command…" autocomplete="off" spellcheck="false" />
        <div class="palette-hint" hidden></div>
        <div class="palette-list" role="listbox"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
