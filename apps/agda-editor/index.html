<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e1e1e" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>agda-editor</title>
    <link rel="stylesheet" href="/src/main.css" />
  </head>
  <body>
    <main id="app">
      <div id="toolbar" class="toolbar">
        <span class="toolbar-title">agda-editor</span>
        <div class="toolbar-actions">
          <button type="button" id="btn-palette" class="toolbar-icon" title="Command palette (Ctrl+Shift+P)"></button>
          <button type="button" id="btn-toggle-side" class="toolbar-icon" title="Toggle the sidebar"></button>
          <button type="button" id="btn-toggle-dock" class="toolbar-icon" title="Toggle the events panel"></button>
        </div>
      </div>
      <div id="main-row">
        <div id="editor-col">
          <div id="editor" class="surface"></div>
          <div id="dock-resize" class="gap gap-row" title="Drag to resize"></div>
          <div id="dock" class="surface dock">
            <div class="dock-head">
              <span class="dock-title">Events</span>
              <label class="dock-level">level
                <select>
                  <option value="debug">debug</option>
                  <option value="info" selected>info</option>
                  <option value="warn">warn</option>
                  <option value="error">error</option>
                </select>
              </label>
            </div>
            <div class="dock-body">
              <div class="dock-events"></div>
            </div>
          </div>
        </div>
        <div id="side-resize" class="gap gap-col" title="Drag to resize"></div>
        <div id="side" class="side">
          <section class="surface panel panel-session">
            <header class="panel-head">Session</header>
            <div class="panel-body" id="session-body"></div>
          </section>
          <div id="panel-resize" class="gap gap-row" title="Drag to resize"></div>
          <section class="surface panel panel-goals">
            <header class="panel-head">Goals</header>
            <div class="panel-body" id="goals-body"></div>
          </section>
        </div>
      </div>
    </main>
    <div id="palette" class="palette" hidden>
      <div class="palette-panel" role="dialog" aria-label="Command palette">
        <input class="palette-input" placeholder="Type a command…" autocomplete="off" spellcheck="false" />
        <div class="palette-hint" hidden></div>
        <div class="palette-list" role="listbox"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
