<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{pagetitle}}</title>
<style>
:root {
  color-scheme: light;
  --bg: #ffffff;
  --fg: #1f2328;
  --muted: #656d76;
  --border: #d8dee4;
  --card: #f6f8fa;
  --accent: #0969da;
  --code-bg: #f6f8fa;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --bg: #0d1117;
    --fg: #e6edf3;
    --muted: #8b949e;
    --border: #30363d;
    --card: #161b22;
    --accent: #4493f8;
    --code-bg: #161b22;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial,
    sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
  font-size: 16px;
  line-height: 1.6;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 1rem;
  padding: 0.9rem 1.5rem;
  border-bottom: 1px solid var(--border);
}
.brand {
  color: var(--fg);
  font-weight: 600;
  text-decoration: none;
}
.brand:hover { color: var(--accent); }
.crumb { color: var(--muted); font-size: 0.875rem; }
main {
  max-width: 48rem;
  margin: 0 auto;
  padding: 2.5rem 1.5rem 3rem;
}
footer {
  padding: 1.25rem;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font-size: 0.875rem;
  text-align: center;
}
a { color: var(--accent); }
h1, h2 {
  border-bottom: 1px solid var(--border);
  padding-bottom: 0.3em;
}
h1 { font-size: 1.9em; margin: 0 0 1rem; }
h2 { font-size: 1.4em; margin: 2.5rem 0 1rem; }
h3 { font-size: 1.15em; margin: 2rem 0 0.75rem; }
p { margin: 0.75rem 0; }
ul, ol { padding-left: 1.5rem; }
li { margin: 0.25rem 0; }
img { max-width: 100%; }
hr { border: 0; border-top: 1px solid var(--border); margin: 2rem 0; }
blockquote {
  margin: 1rem 0;
  padding: 0.25rem 1rem;
  color: var(--muted);
  border-left: 0.25rem solid var(--border);
}
code {
  background: var(--code-bg);
  border-radius: 4px;
  padding: 0.15em 0.4em;
  font-size: 0.875em;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}
pre {
  overflow-x: auto;
  background: var(--code-bg);
  border-radius: 8px;
  padding: 1rem;
}
pre code { background: none; padding: 0; font-size: 0.85rem; }
table {
  display: block;
  overflow-x: auto;
  border-collapse: collapse;
  margin: 1rem 0;
}
th, td {
  border: 1px solid var(--border);
  padding: 0.4rem 0.85rem;
  text-align: left;
}
thead th { background: var(--card); }
kbd {
  display: inline-block;
  border: 1px solid var(--border);
  border-bottom-width: 2px;
  border-radius: 4px;
  background: var(--card);
  padding: 0.1em 0.45em;
  font-size: 0.8em;
  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  white-space: nowrap;
}
.cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(20rem, 1fr));
  gap: 1rem;
  margin: 1.5rem 0;
}
.card {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 1.25rem 1.25rem 0.5rem;
}
.card h3 { margin-top: 0; }
.card:hover { border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <a class="brand" href="{{home}}">Playground</a>
  <span class="crumb">{{crumb}}</span>
</header>
<main>
{{content}}
</main>
<footer>
  <a href="https://github.com/huangjunwen/playground">huangjunwen/playground</a>
</footer>
</body>
</html>
